name: Alertas

on:
  schedule:
    # De lunes a viernes a las 17:30 UTC (18:30 en invierno, 19:30 en verano, hora de Madrid)
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar el mensaje, sin enviarlo"
        type: boolean
        default: true

jobs:
  alertas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install pandas numpy yfinance lxml requests
      - name: Calcular y enviar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          UMBRAL_CAIDA_SEMANA: "5"
          RESUMEN_DIA: "4"
        run: python alertas.py
